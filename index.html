<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A calm, slow drive through endless countryside roads. Pick a car, pick a colour, and enjoy the view.">
<title>Slow Roads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.72);
    --line: rgba(255, 255, 255, 0.55);
    --glass: rgba(14, 20, 26, 0.62);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #87b6d8;
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Gauges ---------- */
  .gauge {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
  }
  .gauge.left  { left: 18px; }
  .gauge.right { right: 18px; text-align: right; }
  .value { font-weight: 300; font-size: clamp(30px, 6.5vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
  .unit  { font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-top: 6px; }

  /* ---------- Road map ---------- */
  #map {
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top)) + 84px);
    right: 18px;
    width: 150px;
    height: 150px;
    pointer-events: none;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
  }

  /* ---------- Round controls ---------- */
  .round {
    position: fixed;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: var(--ink);
    font: 400 12px "Sora", system-ui, sans-serif;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
    padding: 0;
    text-align: center;
    line-height: 1.2;
  }
  .round:active, .round.held { background: rgba(255, 255, 255, 0.28); transform: scale(0.97); }
  .round:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .round.big { font-size: 13px; }
  #brake  { width: 120px; height: 120px; left: 22px;  bottom: calc(52px + env(safe-area-inset-bottom)); }
  #accel  { width: 120px; height: 120px; right: 22px; bottom: calc(52px + env(safe-area-inset-bottom)); }
  #reset  { width: 52px;  height: 52px;  left: 22px;  bottom: calc(190px + env(safe-area-inset-bottom)); }
  #cam    { width: 52px;  height: 52px;  right: 22px; bottom: calc(190px + env(safe-area-inset-bottom)); }

  /* ---------- Steering ---------- */
  .steer-wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(92px + env(safe-area-inset-bottom));
    width: min(40vw, 320px);
    height: 44px;
    display: flex;
    align-items: center;
  }
  #steer {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 44px;
    background: transparent;
    cursor: ew-resize;
  }
  #steer::-webkit-slider-runnable-track { height: 1.5px; background: var(--line); }
  #steer::-moz-range-track { height: 1.5px; background: var(--line); }
  #steer::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px; margin-top: -12.25px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    border: 1.5px solid #fff;
  }
  #steer::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18); border: 1.5px solid #fff;
  }
  #steer:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  /* ---------- Menu ---------- */
  nav.menu {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 6px;
    padding: 5px;
    border-radius: 999px;
    background: var(--glass);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  nav.menu button {
    font: 400 13px "Sora", system-ui, sans-serif;
    color: var(--ink-soft);
    background: transparent;
    border: 0;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  nav.menu button[aria-pressed="true"] { background: #fff; color: #142030; }
  nav.menu button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- Panel ---------- */
  #panel {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(66px + env(safe-area-inset-bottom));
    width: min(92vw, 480px);
    max-height: 46vh;
    overflow-y: auto;
    padding: 16px;
    border-radius: 18px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #panel[hidden] { display: none; }
  #panel h2 { font-size: 14px; font-weight: 400; color: var(--ink-soft); margin-bottom: 12px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .opt {
    font: 400 13px "Sora", system-ui, sans-serif;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 12px;
    padding: 12px 10px;
    cursor: pointer;
    text-align: left;
  }
  .opt[aria-pressed="true"] { border-color: #fff; background: rgba(255, 255, 255, 0.18); }
  .opt:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; align-items: center; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    cursor: pointer; padding: 0;
  }
  .swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3); }
  .swatch:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #customColor {
    width: 40px; height: 40px; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%;
  }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
  @media (max-width: 600px) {
    .steer-wrap { width: 34vw; }
    #brake, #accel { width: 96px; height: 96px; }
    #brake { bottom: calc(52px + env(safe-area-inset-bottom)); }
    #accel { bottom: calc(52px + env(safe-area-inset-bottom)); }
    #reset, #cam { width: 48px; height: 48px; bottom: calc(160px + env(safe-area-inset-bottom)); }
    #map { width: 120px; height: 120px; }
    nav.menu button { padding: 9px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-label="Driving view"></canvas>

<div class="gauge left">
  <div class="value" id="dist">0.0</div>
  <div class="unit">Kilometres</div>
</div>
<div class="gauge right">
  <div class="value" id="spd">0</div>
  <div class="unit">km/h</div>
</div>

<canvas id="map" width="300" height="300" aria-label="Road map"></canvas>

<button class="round" id="reset" aria-label="Reset car to the start">Reset</button>
<button class="round" id="cam" aria-label="Change camera">Cam</button>
<button class="round big" id="brake" aria-label="Brake">Brake</button>
<button class="round big" id="accel" aria-label="Accelerate">Accelerate</button>

<div class="steer-wrap">
  <input id="steer" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Steering">
</div>

<div id="panel" hidden role="dialog" aria-live="polite"></div>

<nav class="menu" aria-label="Options">
  <button data-tab="world" aria-pressed="false">World</button>
  <button data-tab="style" aria-pressed="false">Style</button>
  <button data-tab="vehicle" aria-pressed="false">Vehicle</button>
  <button id="autoBtn" aria-pressed="false" title="Autodrive (P)">Autodrive</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";

  /* =====================================================================
     CONFIG: add cars, colours and times of day here. See README.md.
     ===================================================================== */

  // Each part: [type, width, height, length, x, y, z]
  // type: body (paint) | glass | dark | light | tail
  const CAR_MODELS = [

      parts: [

        ["glass", 1.55, 0.5, 2.2,  0, 1.08, -0.2],
        ["body",  1.6, 0.07, 2.1,  0, 1.36, -0.2],

    {

      parts: [
        ["body",  1.82, 0.62, 4.6,  0, 0.6,   0],
        ["glass", 1.6, 0.6, 2.3,    0, 1.2,  -0.3],
        ["body",  1.62, 0.07, 2.2,  0, 1.52, -0.3],
        ["light", 1.6, 0.1, 0.05,   0, 0.7,   2.31],

    {

      parts: [
        ["body",  1.76, 0.78, 3.9, 0, 0.65,  0],
        ["glass", 1.58, 0.6, 2.7,  0, 1.33, -0.15],
        ["body",  1.6, 0.07, 2.5,  0, 1.67, -0.15],
        ["light", 1.5, 0.1, 0.05,  0, 0.72,  1.96],
        ["tail",  1.5, 0.12, 0.05, 0, 0.72, -1.96]
      ]
    },
    {
      id: "sports", name: "Sports", wheelR: 0.34, wheelX: 0.9, wheelZ: 1.35,
      parts: [
        ["body",  1.9, 0.45, 4.3, 0, 0.42,  0],
        ["glass", 1.5, 0.36, 1.7, 0, 0.9,  -0.35],
        ["body",  1.5, 0.05, 1.5, 0, 1.1,  -0.35],
        ["dark",  1.7, 0.06, 0.3, 0, 0.95, -2.0],
        ["dark",  0.08, 0.3, 0.08, -0.6, 0.78, -1.9],
        ["dark",  0.08, 0.3, 0.08,  0.6, 0.78, -1.9],
        ["light", 1.6, 0.06, 0.05, 0, 0.6,   2.16],
        ["tail",  1.6, 0.08, 0.05, 0, 0.6,  -2.16]
      ]
    },
    {
      id: "suv", name: "SUV", wheelR: 0.42, wheelX: 0.93, wheelZ: 1.5,
      parts: [
        ["body",  2.0, 1.0, 4.6,  0, 0.95,  0],
        ["glass", 1.85, 0.6, 3.2, 0, 1.85, -0.2],
        ["body",  1.9, 0.07, 3.0, 0, 2.2,  -0.2],
        ["dark",  1.7, 0.05, 2.5, 0, 2.28, -0.2],
        ["light", 1.8, 0.12, 0.05, 0, 0.98, 2.31],
        ["tail",  1.8, 0.14, 0.05, 0, 0.98, -2.31]
      ]
    },
    {
      id: "pickup", name: "Pickup", wheelR: 0.42, wheelX: 0.93, wheelZ: 1.4,
      parts: [
        ["body",  1.9, 0.75, 2.0, 0, 0.95, 1.5],
        ["body",  1.9, 0.9, 1.9,  0, 1.35, 0.2],
        ["glass", 1.7, 0.5, 0.05, 0, 1.5,  1.18],
        ["body",  1.9, 0.08, 1.9, 0, 1.84, 0.2],
        ["body",  1.9, 0.1, 2.1,  0, 0.9, -1.3],
        ["body",  0.08, 0.5, 2.1, -0.91, 1.2, -1.3],
        ["body",  0.08, 0.5, 2.1,  0.91, 1.2, -1.3],
        ["light", 1.6, 0.1, 0.05, 0, 0.9, 2.46],
        ["tail",  1.6, 0.12, 0.05, 0, 0.95, -2.36]
      ]
    }
  ];

  const COLOURS = [
    { name: "Pearl white", hex: "#f2f2f0" },
    { name: "Midnight black", hex: "#15171c" },
    { name: "Racing red", hex: "#c8102e" },
    { name: "Ocean blue", hex: "#1e5fa8" },
    { name: "Sky blue", hex: "#6ec1ea" },
    { name: "Forest green", hex: "#2f6b3a" },
    { name: "Lime", hex: "#9bd13a" },
    { name: "Sunflower", hex: "#f5c518" },
    { name: "Orange", hex: "#f2711c" },
    { name: "Violet", hex: "#6b3fa0" },
    { name: "Pink", hex: "#ec6ba5" },
    { name: "Silver", hex: "#b9bec7" },
    { name: "Bronze", hex: "#8c5a2b" },
    { name: "Teal", hex: "#119c94" }
  ];

  const WORLDS = {
    day:    { name: "Day",    sky: 0x9fd0f0, grass: 0x6fae4a, leaf: 0x3a8a3c, trunk: 0x6b4a2b, sun: 1.0,  sunCol: 0xffffff, hemi: 0.75, fog: [170, 800] },
    sunset: { name: "Sunset", sky: 0xf2a46b, grass: 0x7f9a3c, leaf: 0x5b7a2e, trunk: 0x4a3424, sun: 0.85, sunCol: 0xffc08a, hemi: 0.6,  fog: [150, 700] },
    night:  { name: "Night",  sky: 0x0b1428, grass: 0x2a4329, leaf: 0x244a2d, trunk: 0x2e2218, sun: 0.3,  sunCol: 0x9fb8ff, hemi: 0.4,  fog: [120, 500] }
  };

  const CAM_MODES = [
    { back: 7.5, up: 3.0, look: 5 },   // chase
    { back: 4.0, up: 1.7, look: 4 },   // close
    { back: 13,  up: 6.0, look: 6 }    // wide
  ];

  /* =====================================================================
     TUNING
     ===================================================================== */
  const SEG = 4;             // metres between road points
  const CH = 25;             // road points per mesh chunk
  const ROAD_W = 7;          // road width (metres)
  const VIEW = 900;          // road chunks are drawn within this distance
  const EXTEND_R = 1100;     // roads grow while their end is within this distance
  const MAX_K = 0.008;       // how sharp random bends can get (1/m)
  const MAX_SPEED = 36;      // m/s (about 130 km/h)
  const GRASS_MAX = 11;      // m/s cap while driving on grass
  const TREE_NEAR = 560;     // trees are placed within this distance
  const TREE_FAR = 760;      // trees beyond this are removed
  const CELL = 100;          // tree cell size (metres)

  /* =====================================================================
     SAVED PREFERENCES
     ===================================================================== */
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("slowroads") || "{}"); } catch (e) { return {}; } },
    set(obj) { try { localStorage.setItem("slowroads", JSON.stringify(obj)); } catch (e) {} }
  };
  const saved = store.get();

  /* =====================================================================
     RENDERER / SCENE
     ===================================================================== */
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1500);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.75);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  scene.add(sun);

  const groundMat = new THREE.MeshLambertMaterial({ color: 0x6fae4a });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const MAT = {
    road:  new THREE.MeshLambertMaterial({ color: 0x3b3e44, side: THREE.DoubleSide }),
    line:  new THREE.MeshLambertMaterial({ color: 0xf2f2f0, side: THREE.DoubleSide }),
    trunk: new THREE.MeshLambertMaterial({ color: 0x6b4a2b }),
    leaf:  new THREE.MeshLambertMaterial({ color: 0x3a8a3c }),
    glass: new THREE.MeshStandardMaterial({ color: 0x1b2630, metalness: 0.6, roughness: 0.05 }),
    dark:  new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 }),
    light: new THREE.MeshStandardMaterial({ color: 0xfff6d5, emissive: 0xfff1c0, emissiveIntensity: 0.6 }),
    tail:  new THREE.MeshStandardMaterial({ color: 0xaa1111, emissive: 0x440000 })
  };
  const GEO = {
    trunk: new THREE.CylinderGeometry(0.25, 0.35, 2.2, 6).translate(0, 1.1, 0),
    round: new THREE.IcosahedronGeometry(2.2, 0).translate(0, 3.6, 0),
    pine:  new THREE.ConeGeometry(2.0, 5, 7).translate(0, 4.2, 0)
  };

  /* =====================================================================
     ROADS
     Each road is a random walk: its bend sharpness drifts to new random
     targets at random intervals. Roads are stored as point lists plus a
     spatial grid so the car, autodrive and map can find them quickly.
     ===================================================================== */
  const roads = [];
  const grid = new Map();

  function gridKey(cx, cz) { return cx + "," + cz; }

  function gridAdd(p) {
    const k = gridKey(Math.floor(p.x / 50), Math.floor(p.z / 50));
    let a = grid.get(k);
    if (!a) { a = []; grid.set(k, a); }
    a.push(p);
  }

  // Closest road point within radius R of (x, z), or null.
  function nearestRoad(x, z, R) {
    const x0 = Math.floor((x - R) / 50), x1 = Math.floor((x + R) / 50);
    const z0 = Math.floor((z - R) / 50), z1 = Math.floor((z + R) / 50);
    let best = null, bd = R * R;
    for (let cx = x0; cx <= x1; cx++) {
      for (let cz = z0; cz <= z1; cz++) {
        const a = grid.get(gridKey(cx, cz));
        if (!a) continue;
        for (const p of a) {
          const dx = p.x - x, dz = p.z - z, d2 = dx * dx + dz * dz;
          if (d2 < bd) { bd = d2; best = p; }
        }
      }
    }
    return best ? { pt: best, d: Math.sqrt(bd) } : null;
  }

  function newRoad(x, z, h) {
    const r = { pts: [], k: 0, kT: 0, timer: 0, chunks: new Map() };
    const p = { x, z, h, i: 0, r };
    r.pts.push(p);
    gridAdd(p);
    roads.push(r);
    return r;
  }

  // Grow a road forward while its end is close to the car.
  function extendRoad(r, cx, cz) {
    let guard = 0;
    while (guard++ < 400) {
      const last = r.pts[r.pts.length - 1];
      if (Math.hypot(last.x - cx, last.z - cz) > EXTEND_R) break;

      r.timer -= SEG;
      if (r.timer <= 0) {
        r.timer = 60 + Math.random() * 180;
        r.kT = Math.random() < 0.3 ? 0 : (Math.random() * 2 - 1) * MAX_K;
      }
      r.k += (r.kT - r.k) * 0.06;

      const h = last.h + r.k * SEG;
      const p = { x: last.x + Math.sin(h) * SEG, z: last.z + Math.cos(h) * SEG, h, i: r.pts.length, r };
      r.pts.push(p);
      gridAdd(p);
    }
  }

  // A new road starts a little way ahead of the car, pointing in a random-ish direction.
  function spawnRoadAhead() {
    const x = car.x + Math.sin(car.h) * 120;
    const z = car.z + Math.cos(car.h) * 120;
    newRoad(x, z, car.h + (Math.random() - 0.5) * 0.9);
  }

  // Ribbon strip for points i0..i0+CH. off = centre offset, w = width.
  function stripGeo(pts, i0, off, w, y, cond) {
    const p = [], ix = [];
    for (let k = 0; k <= CH; k++) {
      const q = pts[i0 + k];
      const nx = Math.cos(q.h), nz = -Math.sin(q.h);
      const a = off + w / 2, b = off - w / 2;
      p.push(q.x + nx * a, y, q.z + nz * a, q.x + nx * b, y, q.z + nz * b);
    }
    for (let k = 0; k < CH; k++) {
      if (!cond(i0 + k)) continue;
      const a0 = 2 * k, b0 = a0 + 1, a1 = a0 + 2, b1 = a0 + 3;
      ix.push(a0, b0, a1, b0, b1, a1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(p, 3));
    g.setIndex(ix);
    g.computeVertexNormals();
    return g;
  }

  function buildRoadChunk(r, c) {
    const i0 = c * CH, pts = r.pts;
    const meshes = [], geos = [];
    const add = (geo, mat) => {
      const m = new THREE.Mesh(geo, mat);
      scene.add(m);
      meshes.push(m);
      geos.push(geo);
    };
    add(stripGeo(pts, i0, 0, ROAD_W, 0, () => true), MAT.road);
    add(stripGeo(pts, i0, ROAD_W / 2 - 0.45, 0.22, 0.02, () => true), MAT.line);
    add(stripGeo(pts, i0, -(ROAD_W / 2 - 0.45), 0.22, 0.02, () => true), MAT.line);
    add(stripGeo(pts, i0, 0, 0.22, 0.02, i => ((i >> 1) & 1) === 0), MAT.line);
    return { meshes, geos };
  }

  function disposeRoadChunk(ch) {
    ch.meshes.forEach(m => scene.remove(m));
    ch.geos.forEach(g => g.dispose());
  }

  function updateRoads() {
    for (const r of roads) {
      extendRoad(r, car.x, car.z);
      const full = Math.floor((r.pts.length - 1) / CH);
      for (let c = 0; c < full; c++) {
        if (r.chunks.has(c)) continue;
        const mid = r.pts[Math.floor(c * CH + CH / 2)];
        if (Math.hypot(mid.x - car.x, mid.z - car.z) < VIEW) {
          r.chunks.set(c, buildRoadChunk(r, c));
        }
      }
      for (const [c, ch] of r.chunks) {
        const mid = r.pts[Math.floor(c * CH + CH / 2)];
        if (Math.hypot(mid.x - car.x, mid.z - car.z) > VIEW + 300) {
          disposeRoadChunk(ch);
          r.chunks.delete(c);
        }
      }
    }
  }

  /* =====================================================================
     TREES: placed in cells around the car, with instancing for speed.
     Trees are deterministic per cell, so a cell looks the same each time.
     ===================================================================== */
  function hash2(a, b) {
    let h = Math.imul(a, 374761393) ^ Math.imul(b, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function rngFrom(seed) {
    let a = seed | 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function buildTreeCell(cx, cz) {
    const rnd = rngFrom(hash2(cx, cz));
    const meshes = [];
    if (rnd() < 0.25) return meshes;

    const items = [];
    const n = 3 + Math.floor(rnd() * 6);
    for (let t = 0; t < n; t++) {
      const x = cx * CELL + rnd() * CELL;
      const z = cz * CELL + rnd() * CELL;
      if (nearestRoad(x, z, 12)) continue;   // keep trees off the road
      items.push({ x, z, s: 0.7 + rnd() * 0.7, sy: 0.9 + rnd() * 0.3,
                   ry: rnd() * Math.PI * 2, pine: rnd() < 0.45, tint: 0.8 + rnd() * 0.2 });
    }

    const dummy = new THREE.Object3D();
    const spec = [
      [GEO.trunk, MAT.trunk, items],
      [GEO.round, MAT.leaf, items.filter(t => !t.pine)],
      [GEO.pine,  MAT.leaf, items.filter(t => t.pine)]
    ];
    for (const [geo, mat, list] of spec) {
      if (!list.length) continue;
      const im = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((t, i) => {
        dummy.position.set(t.x, 0, t.z);
        dummy.rotation.set(0, t.ry, 0);
        dummy.scale.set(t.s, t.s * t.sy, t.s);
        dummy.updateMatrix();
        im.setMatrixAt(i, dummy.matrix);
        im.setColorAt(i, new THREE.Color(t.tint, t.tint, t.tint));
      });
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
      scene.add(im);
      meshes.push(im);
    }
    return meshes;
  }

  const treeCells = new Map();

  function updateTrees() {
    const cx0 = Math.floor((car.x - TREE_NEAR) / CELL), cx1 = Math.floor((car.x + TREE_NEAR) / CELL);
    const cz0 = Math.floor((car.z - TREE_NEAR) / CELL), cz1 = Math.floor((car.z + TREE_NEAR) / CELL);
    for (let cx = cx0; cx <= cx1; cx++) {
      for (let cz = cz0; cz <= cz1; cz++) {
        const k = cx + "," + cz;
        if (!treeCells.has(k)) treeCells.set(k, { cx, cz, meshes: buildTreeCell(cx, cz) });
      }
    }
    for (const [k, cell] of treeCells) {
      const dx = (cell.cx + 0.5) * CELL - car.x, dz = (cell.cz + 0.5) * CELL - car.z;
      if (Math.hypot(dx, dz) > TREE_FAR) {
        cell.meshes.forEach(m => { scene.remove(m); m.dispose(); });
        treeCells.delete(k);
      }
    }
  }

  /* =====================================================================
     CARS
     ===================================================================== */
  function buildCar(model, hex) {
    const g = new THREE.Group();
    const paint = new THREE.MeshStandardMaterial({ color: hex, metalness: 0.35, roughness: 0.35 });
    const mats = { body: paint, glass: MAT.glass, dark: MAT.dark, light: MAT.light, tail: MAT.tail };

    for (const [type, w, h, l, x, y, z] of model.parts) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mats[type]);
      m.position.set(x, y, z);
      g.add(m);
    }

    const wheelGeo = new THREE.CylinderGeometry(model.wheelR, model.wheelR, 0.26, 18);
    wheelGeo.rotateZ(Math.PI / 2);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const w = new THREE.Mesh(wheelGeo, MAT.dark);
      w.position.set(sx * model.wheelX, model.wheelR, sz * model.wheelZ);
      g.add(w);
    }
    g.userData.paint = paint;
    g.userData.geos = g.children.filter(c => c.geometry).map(c => c.geometry);
    return g;
  }

  let carMesh = null;
  let carModel = CAR_MODELS.find(m => m.id === saved.car) || CAR_MODELS[0];
  let paintHex = saved.color || COLOURS[0].hex;

  function setCar(id) {
    const m = CAR_MODELS.find(c => c.id === id);
    if (!m) return;
    if (carMesh) {
      scene.remove(carMesh);
      carMesh.userData.geos.forEach(g => g.dispose());
      carMesh.userData.paint.dispose();
    }
    carModel = m;
    carMesh = buildCar(m, paintHex);
    scene.add(carMesh);
    saved.car = m.id; store.set(saved);
  }

  function setPaint(hex) {
    paintHex = hex;
    if (carMesh) carMesh.userData.paint.color.set(hex);
    saved.color = hex; store.set(saved);
  }

  /* =====================================================================
     WORLD / ENVIRONMENT
     ===================================================================== */
  let worldKey = saved.world && WORLDS[saved.world] ? saved.world : "day";

  function setWorld(key) {
    const w = WORLDS[key];
    if (!w) return;
    worldKey = key;
    scene.background = new THREE.Color(w.sky);
    scene.fog = new THREE.Fog(w.sky, w.fog[0], w.fog[1]);
    groundMat.color.set(w.grass);
    MAT.leaf.color.set(w.leaf);
    MAT.trunk.color.set(w.trunk);
    sun.intensity = w.sun;
    sun.color.set(w.sunCol);
    hemi.intensity = w.hemi;
    saved.world = key; store.set(saved);
  }

  /* =====================================================================
     CAR: free driving in world space. Steering changes the heading, so
     the car does NOT follow the road's bends by itself.
     ===================================================================== */
  const car = { x: 0, z: 0, h: 0, v: 0, steer: 0, roll: 0, dist: 0 };
  let autodrive = false;
  let snapCamera = true;
  let camMode = Math.min(saved.cam || 0, CAM_MODES.length - 1);

  function resetCar() {
    car.x = 0; car.z = 0; car.h = 0; car.v = 0; car.steer = 0; car.dist = 0;
    snapCamera = true;
  }

  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  // inp = { steer (-1 left .. +1 right), accel, brake }
  function driveStep(dt, inp) {
    const onRoad = !!nearestRoad(car.x, car.z, ROAD_W / 2);

    if (inp.brake) {
      car.v = Math.max(0, car.v - 14 * dt);
    } else if (inp.accel) {
      car.v = Math.min(MAX_SPEED, car.v + 5 * dt);
    } else {
      car.v = Math.max(0, car.v - 0.8 * dt);   // gentle coasting
    }
    if (!onRoad && car.v > GRASS_MAX) {
      car.v = Math.max(GRASS_MAX, car.v - 4 * dt);
    }

    car.steer += (inp.steer - car.steer) * Math.min(1, 10 * dt);
    const turnRate = 1.2 * Math.min(1, car.v / 12);     // rad/s at full lock
    car.h -= car.steer * turnRate * dt;                 // positive steer = turn right

    car.x += Math.sin(car.h) * car.v * dt;
    car.z += Math.cos(car.h) * car.v * dt;
    car.dist += car.v * dt;

    const targetRoll = car.steer * 0.05 * Math.min(1, car.v / 20);
    car.roll += (targetRoll - car.roll) * Math.min(1, 6 * dt);
  }

  // Autodrive: steer toward a point 12 road points ahead on the nearest road.
  function autoPilot() {
    const near = nearestRoad(car.x, car.z, 400);
    let steer = 0, target = 14;
    if (near) {
      const r = near.pt.r;
      const tp = r.pts[Math.min(near.pt.i + 12, r.pts.length - 1)];
      const desired = Math.atan2(tp.x - car.x, tp.z - car.z);
      const diff = wrapAngle(desired - car.h);
      steer = Math.max(-1, Math.min(1, -diff * 2.2));
      target = 16 * (1 - Math.min(0.5, Math.abs(diff) * 0.6));
    }
    return {
      steer,
      accel: car.v < target - 0.5,
      brake: car.v > target + 4
    };
  }

  function setAutodrive(on) {
    autodrive = on;
    const b = document.getElementById("autoBtn");
    b.setAttribute("aria-pressed", String(on));
  }

  function toggleAutodrive() { setAutodrive(!autodrive); }

  function cycleCam() {
    camMode = (camMode + 1) % CAM_MODES.length;
    snapCamera = true;
    saved.cam = camMode; store.set(saved);
  }

  function updateCamera(dt) {
    const c = CAM_MODES[camMode];
    const fx = Math.sin(car.h), fz = Math.cos(car.h);
    const tx = car.x - fx * c.back, ty = c.up, tz = car.z - fz * c.back;
    const k = snapCamera ? 1 : 1 - Math.exp(-dt * 6);
    camera.position.x += (tx - camera.position.x) * k;
    camera.position.y += (ty - camera.position.y) * k;
    camera.position.z += (tz - camera.position.z) * k;
    camera.lookAt(car.x + fx * c.look, 1.0, car.z + fz * c.look);
    snapCamera = false;
  }

  /* =====================================================================
     INPUT
     ===================================================================== */
  const steerEl = document.getElementById("steer");
  const hudDist = document.getElementById("dist");
  const hudSpd = document.getElementById("spd");
  const keys = {};
  const held = { accel: false, brake: false };

  function readManual() {
    let steer = Number(steerEl.value);
    if (keys.ArrowLeft || keys.KeyA) steer -= 1;
    if (keys.ArrowRight || keys.KeyD) steer += 1;
    steer = Math.max(-1, Math.min(1, steer));
    const accel = held.accel || !!(keys.ArrowUp || keys.KeyW);
    const brake = held.brake || !!(keys.ArrowDown || keys.KeyS);
    const any = Math.abs(steer) > 0.05 || accel || brake;
    return { steer, accel, brake, any };
  }

  function releaseSteer() { steerEl.value = 0; }
  steerEl.addEventListener("pointerup", releaseSteer);
  steerEl.addEventListener("pointercancel", releaseSteer);
  steerEl.addEventListener("change", releaseSteer);

  function bindHold(el, key) {
    const on = () => { held[key] = true; el.classList.add("held"); };
    const off = () => { held[key] = false; el.classList.remove("held"); };
    el.addEventListener("pointerdown", e => { e.preventDefault(); on(); });
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
  }
  bindHold(document.getElementById("accel"), "accel");
  bindHold(document.getElementById("brake"), "brake");

  document.getElementById("cam").addEventListener("click", cycleCam);
  document.getElementById("reset").addEventListener("click", resetCar);
  document.getElementById("autoBtn").addEventListener("click", toggleAutodrive);

  window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "KeyC") cycleCam();
    if (e.code === "KeyR") resetCar();
    if (e.code === "KeyP") toggleAutodrive();
    if (e.code === "Escape") closePanel();
    if (e.code.startsWith("Arrow")) e.preventDefault();
  });
  window.addEventListener("keyup", e => { keys[e.code] = false; });

  /* =====================================================================
     PANEL (World / Style / Vehicle)
     ===================================================================== */
  const panel = document.getElementById("panel");
  const tabs = Array.from(document.querySelectorAll("nav.menu button[data-tab]"));
  let openTab = null;

  function renderPanel(tab) {
    if (tab === "vehicle") {
      panel.innerHTML = '<h2>Choose a car</h2><div class="opts"></div>';
      const box = panel.querySelector(".opts");
      CAR_MODELS.forEach(m => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = m.name;
        b.setAttribute("aria-pressed", String(m.id === carModel.id));
        b.addEventListener("click", () => { setCar(m.id); renderPanel("vehicle"); });
        box.appendChild(b);
      });
    }

    if (tab === "style") {
      panel.innerHTML = '<h2>Paint colour</h2><div class="swatches"></div><p class="hint">Pick a colour, or use the custom picker.</p>';
      const box = panel.querySelector(".swatches");
      COLOURS.forEach(c => {
        const b = document.createElement("button");
        b.className = "swatch";
        b.style.background = c.hex;
        b.title = c.name;
        b.setAttribute("aria-label", c.name);
        b.setAttribute("aria-pressed", String(c.hex.toLowerCase() === paintHex.toLowerCase()));
        b.addEventListener("click", () => { setPaint(c.hex); renderPanel("style"); });
        box.appendChild(b);
      });
      const custom = document.createElement("input");
      custom.type = "color";
      custom.id = "customColor";
      custom.value = paintHex;
      custom.setAttribute("aria-label", "Custom colour");
      custom.addEventListener("input", e => setPaint(e.target.value));
      box.appendChild(custom);
    }

    if (tab === "world") {
      panel.innerHTML = '<h2>Time of day</h2><div class="opts"></div>';
      const box = panel.querySelector(".opts");
      Object.keys(WORLDS).forEach(key => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = WORLDS[key].name;
        b.setAttribute("aria-pressed", String(key === worldKey));
        b.addEventListener("click", () => { setWorld(key); renderPanel("world"); });
        box.appendChild(b);
      });
    }
  }

  function openPanel(tab) {
    if (openTab === tab) return closePanel();
    openTab = tab;
    panel.hidden = false;
    renderPanel(tab);
    tabs.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  }

  function closePanel() {
    openTab = null;
    panel.hidden = true;
    tabs.forEach(b => b.setAttribute("aria-pressed", "false"));
  }

  tabs.forEach(b => b.addEventListener("click", () => openPanel(b.dataset.tab)));

  /* =====================================================================
     ROAD MAP (top right). North is up. The arrow shows where the car faces.
     ===================================================================== */
  const mapC = document.getElementById("map");
  const mctx = mapC.getContext("2d");
  const MAP_R = 450;                       // metres shown from centre to edge
  const MAP_S = (mapC.width / 2 - 6) / MAP_R;

  function drawMap() {
    const W = mapC.width, cx = W / 2, cy = W / 2, rad = cx - 4;
    mctx.clearRect(0, 0, W, W);

    mctx.beginPath();
    mctx.arc(cx, cy, rad, 0, Math.PI * 2);
    mctx.fillStyle = "rgba(14, 20, 26, 0.6)";
    mctx.fill();

    mctx.save();
    mctx.beginPath();
    mctx.arc(cx, cy, rad, 0, Math.PI * 2);
    mctx.clip();

    mctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
    mctx.lineWidth = 4;
    mctx.lineCap = "round";
    mctx.lineJoin = "round";
    const limit = (MAP_R * 1.2) * (MAP_R * 1.2);
    for (const r of roads) {
      mctx.beginPath();
      let pen = false;
      for (let i = 0; i < r.pts.length; i += 2) {
        const p = r.pts[i];
        const dx = p.x - car.x, dz = p.z - car.z;
        if (dx * dx + dz * dz > limit) { pen = false; continue; }
        const sx = cx + dx * MAP_S, sy = cy - dz * MAP_S;
        if (!pen) { mctx.moveTo(sx, sy); pen = true; } else { mctx.lineTo(sx, sy); }
      }
      mctx.stroke();
    }
    mctx.restore();

    // Car arrow at the centre, rotated to the heading
    mctx.save();
    mctx.translate(cx, cy);
    mctx.rotate(car.h);
    mctx.beginPath();
    mctx.moveTo(0, -11);
    mctx.lineTo(7, 8);
    mctx.lineTo(0, 4);
    mctx.lineTo(-7, 8);
    mctx.closePath();
    mctx.fillStyle = "#ffffff";
    mctx.shadowColor = "rgba(0,0,0,0.5)";
    mctx.shadowBlur = 4;
    mctx.fill();
    mctx.restore();
  }

  /* =====================================================================
     RESIZE + LOOP
     ===================================================================== */
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Start: the first road begins at the origin, and the car starts on it.
  newRoad(0, 0, 0);
  setWorld(worldKey);
  setCar(carModel.id);

  let last = performance.now();
  let spawnTimer = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // Any manual control switches autodrive off
    const manual = readManual();
    if (manual.any && autodrive) setAutodrive(false);
    const inp = autodrive ? autoPilot() : manual;

    driveStep(dt, inp);

    spawnTimer += dt;
    if (spawnTimer > 0.5) {
      spawnTimer = 0;
      if (!nearestRoad(car.x, car.z, 400)) spawnRoadAhead();
    }

    updateRoads();
    updateTrees();

    carMesh.position.set(car.x, 0, car.z);
    carMesh.rotation.set(0, car.h, car.roll, "YXZ");
    ground.position.set(car.x, -0.05, car.z);
    sun.position.set(car.x - 60, 90, car.z + 40);
    sun.target.position.set(car.x, 0, car.z);

    updateCamera(dt);

    hudDist.textContent = (car.dist / 1000).toFixed(1);
    hudSpd.textContent = Math.round(car.v * 3.6);
    drawMap();

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
